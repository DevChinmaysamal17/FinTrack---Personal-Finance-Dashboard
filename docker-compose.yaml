services:

  db:
    image: postgres:18.4
    container_name: fintrack-db

    environment:
      POSTGRES_USER: chinmaydattatraysamal
      POSTGRES_PASSWORD: chinmaydattatraysamal
      POSTGRES_DB: finance_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinmaydattatraysamal -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: fintrack-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: