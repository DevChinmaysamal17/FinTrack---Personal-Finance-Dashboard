<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FinTrack - Budget</title>

  <link rel="stylesheet" href="/static/budget-style.css" />
</head>

<body>

  <div class="sidebar">

    <div class="logo">
      <div class="logo-icon">FT</div>FinTrack
    </div>
    <a href="/static/dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="/static/transactions.html" class="nav-item">⇄ Transactions</a>
    <a href="/static/budget.html" class="nav-item active">◎ Budget</a>

    <div class="sidebar-spacer"></div>

    <div class="user-box">
      <div id="user-name">Loading...</div>

      <div id="user-email" style="font-size: 11px; color: #c7c7f5;">
        —
      </div>

      <button class="logout-btn" onclick="logout()">
        Log Out
      </button>
    </div>

  </div>

  <div class="main">

    <div class="topbar">
      <div>
        <div class="page-title">Budget</div>
        <div class="page-sub">
          Manage your monthly budgets
        </div>
      </div>

      <button class="add-btn" onclick="showModal()">
        + Add Budget
      </button>
    </div>

    <div id="modal" style="display:none;">
      <div class="modal-box">
        <h3>Add Budget</h3>

        <div class="form-group">
          <label>Category</label>
          <select id="tx-category">
            <option value="">Select category</option>
          </select>
        </div>

        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="tx-amount" placeholder="0.00" />
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="tx-date" />
        </div>

        <div class="modal-btns">
          <button class="btn-cancel" onclick="hideModal()">Cancel</button>
          <button class="btn-save" onclick="saveBudget()">Save</button>
        </div>
      </div>
    </div>

    <!-- Cards -->
    <div class="cards-grid">

      <div class="card">
        <div class="card-label">Total Budget</div>
        <div class="card-value blue">Loading...</div>
      </div>

      <div class="card">
        <div class="card-label">Spent</div>
        <div class="card-value red">Loading...</div>
      </div>

      <div class="card">
        <div class="card-label">Remaining</div>
        <div class="card-value green">Loading...</div>
      </div>

    </div>

    <!-- Budget List -->
    <div class="box">

      <div class="box-header">
        <div class="box-title">Budget Categories</div>
      </div>

      <div id="budget-list"></div>

      <div class="budget-left">
        <div class="budget-name">Loading...</div>
        <div class="budget-meta">
          ₹Loading...
        </div>
      </div>

      <div class="budget-right">

        <div class="budget-amount">
          Loading...
        </div>

        <div class="budget-progress">
          <div class="progress-fill" style="width:67%;"></div>
        </div>

      </div>
    </div>
  </div>
  <script src="/static/budget.js"></script>
  <script src="/static/utils.js"></script>

  <script>
  </script>

</body>

</html>
