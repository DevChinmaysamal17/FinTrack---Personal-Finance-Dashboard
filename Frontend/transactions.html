<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack - Transactions</title>
  <link rel="stylesheet" href="/static/transactions-style.css" />
</head>

<body>

  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon">FT</div>
      FinTrack
    </div>
    <a href="/static/dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="/static/transactions.html" class="nav-item active">⇄ Transactions</a>
    <a href="/static/budget.html" class="nav-item">◎ Budget</a>
    <div class="sidebar-spacer"></div>
    <div class="user-box">
      <div id="user-name">Loading...</div>
      <div id="user-email" style="font-size:11px; color:#c7c7f5;">—</div>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </div>

  <div class="main">

    <div class="topbar">
      <div>
        <div class="page-title">Transactions</div>
        <div class="page-sub">All your income and expenses</div>
      </div>
      <button class="add-btn" onclick="showModal()">+ Add Transaction</button>
    </div>

    <div class="cards-grid">
      <div class="card">
        <div class="card-label">Total Income</div>
        <div class="card-value green" id="stat-income">₹0</div>
      </div>
      <div class="card">
        <div class="card-label">Total Expenses</div>
        <div class="card-value red" id="stat-expense">₹0</div>
      </div>
      <div class="card">
        <div class="card-label">Count</div>
        <div class="card-value blue" id="stat-count">0</div>
      </div>
    </div>

    <div class="filter-bar">
      <select id="filter-type">
        <option value="">All Transactions</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button id="filter-button" onclick="applyFilter()">
        Filter
      </button>
    </div>

    <div class="box">
      <table>
        <thead>
          <tr>
            <th>Note</th>
            <th>Category</th>
            <th>Type</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tx-body">
          <tr>
            <td colspan="6">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <div id="modal" style="display:none;">
    <div class="modal-box">
      <h3>Add Transaction</h3>
      <div class="form-group">
        <label>Type</label>
        <select id="tx-type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="tx-amount" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label>Note</label>
        <input type="text" id="tx-note" placeholder="e.g. Grocery shopping" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="tx-category">
          <option value="">Select category</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="tx-date" />
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="hideModal()">Cancel</button>
        <button class="btn-save" onclick="saveTransaction()">Save</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" style="display:none;">
    <div class="modal-box" style="text-align:center; max-width:340px;">
      <h3>Delete Transaction?</h3>
      <p style="color:#888; margin:12px 0;">This cannot be undone.</p>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="hideConfirm()">Cancel</button>
        <button class="btn-delete" onclick="confirmDelete()">Yes, Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/transactions.js"></script>
  <script src="/static/utils.js"></script>
</body>

</html>
